<!doctype html>

<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#f4f6f8"
>

<title>
ALI Flow Radar Terminal v4.5.1
</title>

<script
  src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js">
</script>

<style>

:root{
  --bg:#f4f6f8;
  --panel:#fff;
  --panel2:#fafbfd;
  --line:#dfe5eb;
  --text:#17212b;
  --muted:#7b8794;
  --good:#169b62;
  --bad:#d84b4b;
  --warn:#d99a24;
  --accent:#2779bd;
  --blue-soft:#eaf4fb;
  --red-soft:#fff0ef;
  --green-soft:#ebf8f1;
  --shadow:
    0 2px 9px
    rgba(30,50,70,.05)
}

*{
  box-sizing:border-box
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    Tahoma,
    "Segoe UI",
    sans-serif
}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:
    rgba(255,255,255,.95);
  border-bottom:
    1px solid
    var(--line);
  backdrop-filter:
    blur(14px)
}

.header-inner{
  max-width:1600px;
  margin:auto;
  padding:11px 18px
}

.topline{
  display:flex;
  align-items:center;
  justify-content:
    space-between;
  gap:15px
}

.brandline{
  display:flex;
  align-items:center;
  gap:12px
}

.logo{
  width:34px;
  height:34px;
  border-radius:50%;
  border:
    2px solid
    var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  background:#fff
}

h1{
  margin:0;
  font-size:18px
}

.small{
  font-size:11px;
  color:var(--muted)
}

.tiny{
  font-size:9px;
  color:var(--muted)
}

.livebox{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--muted)
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--warn)
}

.dot.live{
  background:var(--good);
  box-shadow:
    0 0 8px
    rgba(22,155,98,.6)
}

nav{
  display:flex;
  gap:7px;
  margin-top:10px;
  overflow:auto;
  padding-bottom:2px
}

button,
input,
select{
  font:inherit
}

button{
  border:
    1px solid
    var(--line);
  color:var(--text);
  background:#fff;
  border-radius:8px;
  padding:8px 11px;
  cursor:pointer
}

button.active{
  background:
    var(--blue-soft);
  border-color:#a8cce3;
  color:#126092;
  font-weight:700
}

button.primary{
  background:#1e72a8;
  color:#fff;
  border-color:#1e72a8
}

button.danger{
  color:var(--bad);
  border-color:#efcccc
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

main{
  max-width:1600px;
  margin:auto;
  padding:16px
}

.tab{
  display:none
}

.tab.active{
  display:block
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(12,1fr
